# Brand-Ops CI gate (Forgejo Actions). Runs on push to main / feat branches and
# on pull requests: lint + the full Python suite, the web typecheck + build +
# unit tests, and a dependency-advisory scan. Requires a Forgejo Actions runner
# registered with the `ubuntu-latest` label on git.unicorncommander.ai; until one
# exists this file is inert (it activates the moment a runner is available).
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uv run --extra backends --extra dev ruff check .
      - name: Pytest
        # The few asset-serving tests self-skip when the gitignored brand-kit
        # assets are absent (a fresh checkout has none); everything else runs.
        run: uv run --extra backends --extra dev pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Python advisories (pip-audit)
        # Fails the build on any known Python advisory. pip-audit exits non-zero
        # when it finds one, so there is no `|| true`: a new high/critical CVE
        # turns the gate red and someone has to act on it.
        #
        # Accepted-advisory ignore list. To accept a vuln that cannot be fixed
        # yet (no patched release, or a false positive for how we use the dep),
        # add a `--ignore-vuln <ID>` line below WITH a comment that records the
        # advisory id, the reason, and a re-review date. Keep the list short and
        # revisit it; an unbounded ignore list defeats the gate.
        run: >
          uvx pip-audit
          --strict
          --desc
        # Example of an accepted advisory (remove when adding real ones):
        #   uvx pip-audit --strict --desc \
        #     --ignore-vuln GHSA-xxxx-xxxx-xxxx  # <pkg>: no fix yet, not on our path; re-review 2026-09
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Node advisories (npm audit)
        working-directory: web
        # Fails on high or critical advisories in the production dependency tree.
        # --audit-level=high makes npm exit non-zero at high+; --omit=dev keeps
        # build-only tooling out of the runtime risk picture.
        #
        # Accepted-advisory mechanism: npm audit has no per-id ignore flag, so to
        # accept a specific advisory add an `overrides` entry in web/package.json
        # that forces a patched (or known-safe) version, WITH a comment recording
        # the advisory id and reason. Do not blanket-raise --audit-level to mute
        # findings.
        run: npm audit --omit=dev --audit-level=high
