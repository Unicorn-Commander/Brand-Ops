# Alembic configuration for Brand-Ops.
#
# The database URL is NOT set here. env.py reads it from
# brand_ops.config.get_settings().database_url (the DATABASE_URL env var) so
# there is no connection string committed to the repo. Run migrations as the
# brand_ops_owner role; the application connects as brand_ops_app, which cannot
# bypass row level security.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# Timestamped, slugged revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = uvx
ruff.options = ruff check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
