[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-ops"
version = "0.6.1"
description = "Brand identity and AI image-asset generation for the Unicorn Commander suite. MCP and agent first."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=1.2",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "python-jose[cryptography]>=3.3",
  "structlog>=24.4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Provider SDKs are lazy-imported by their adapters, so they stay optional.
backends = [
  "google-genai>=1.0.0",
  "openai>=1.40",
  "pillow>=10.0",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
brand-ops = "brand_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Bundle the OFL fonts (Inter, Space Grotesk) used by the deterministic card
# compositor so they ship in the installed package, not just the source tree.
[tool.setuptools.package-data]
brand_ops = ["assets/fonts/*.ttf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
