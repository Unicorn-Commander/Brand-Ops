server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;

    # Nginx-only health for container checks
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Backend liveness, exposed for operators.
    location /health {
        proxy_pass http://brand-ops-backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # API proxy to the Brand-Ops backend. The web client calls relative /api/...
    # paths; in dev Vite proxies them, in prod nginx does. Generous timeout so a
    # live generation or an agent run does not get cut off.
    location /api/ {
        proxy_pass http://brand-ops-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # Cache the hashed Vite assets hard; they are content-addressed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path serves index.html so client-side routing
    # (/, /brands, /brands/:slug, /library, /workflows) works on deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
