<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand-Ops - Every brand, under command</title>
    <meta
      name="description"
      content="The Unicorn Commander suite app where brands live as machine-readable truth and agents research, generate, guard, and grade on-brand work."
    />
    <meta name="theme-color" content="#07070b" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph: the rich preview a link unfurls into when shared on social,
         iMessage, RCS, Slack, Discord, etc. og:image / og:url must be absolute,
         so __SITE_URL__ is substituted at build time (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brand-Ops" />
    <meta property="og:title" content="Brand-Ops - Every brand, under command" />
    <meta
      property="og:description"
      content="The Unicorn Commander suite app where brands live as machine-readable truth and agents research, generate, guard, and grade on-brand work."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Brand-Ops - Every brand, under command" />

    <!-- Twitter / X large-image card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brand-Ops - Every brand, under command" />
    <meta
      name="twitter:description"
      content="The Unicorn Commander suite app where brands live as machine-readable truth and agents research, generate, guard, and grade on-brand work."
    />
    <meta name="twitter:image" content="__SITE_URL__/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
