<!doctype html>
<html lang="en">

    <meta property="og:site_name" content="Brand-Ops" />
    <meta property="og:title" content="Brand-Ops - Every brand, under command" />
    <meta
      property="og:description"
      content="The Unicorn Commander suite app where brands live as machine-readable truth and agents research, generate, guard, and grade on-brand work."
    />
    <meta property="og:url" content="https://brand-ops.magicunicorn.dev/" />
    <meta property="og:image" content="https://brand-ops.magicunicorn.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Brand-Ops - Every brand, under command" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brand-Ops - Every brand, under command" />

      name="twitter:description"
      content="The Unicorn Commander suite app where brands live as machine-readable truth and agents research, generate, guard, and grade on-brand work."

    <style>
      :root {
        color-scheme: dark;
        font-family: "Instrument Sans", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #07070b;
        color: #f2f1ee;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #a8a6b3;
        line-height: 1.5;
      }
      a {
        color: #9b8cff;
        text-decoration: none;
        font-weight: 500;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brand-Ops</h1>
      <p>Every brand, under command. Sign in through Magic Unicorn SSO to open the studio.</p>
