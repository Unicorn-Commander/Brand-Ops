  <g transform="translate(24,40)">
    <use href="#wm-net" filter="url(#wm-glow)" opacity="0.8"/>
    <use href="#wm-net"/>
  </g>

  <text x="186" y="112" font-size="76" font-weight="700" letter-spacing="-2"
        font-family="'Bricolage Grotesque',system-ui,sans-serif">
    <tspan fill="#eef5f1">Contact</tspan><tspan fill="#19c37d">-Ops</tspan>
  </text>
  <text x="190" y="150" font-size="20.5" font-weight="500" letter-spacing="0.4" fill="#8aa79b"
