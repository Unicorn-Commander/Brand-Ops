<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Contact-Ops">
  <title>Contact-Ops — Relationship intelligence you self-host</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Geist:wght@400;500;700&amp;display=swap');</style>
    <linearGradient id="og-edge" x1="14" y1="100" x2="100" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e9f6e"/><stop offset="0.55" stop-color="#19c37d"/><stop offset="1" stop-color="#5ef2b3"/>
    </linearGradient>
    <radialGradient id="og-node" cx="0.36" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#7ff5c4"/><stop offset="0.45" stop-color="#19c37d"/><stop offset="1" stop-color="#0c8a60"/>
    </radialGradient>
    <radialGradient id="og-anchor" cx="0.36" cy="0.30" r="0.9">
      <stop offset="0" stop-color="#ffe2ad"/><stop offset="0.45" stop-color="#ffb454"/><stop offset="1" stop-color="#f0901f"/>
    </radialGradient>
    <radialGradient id="og-aurora" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#19c37d" stop-opacity="0.30"/><stop offset="1" stop-color="#19c37d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-tile" cx="0.34" cy="0.28" r="1.05">
      <stop offset="0" stop-color="#0e1f18"/><stop offset="0.5" stop-color="#0a140f"/><stop offset="1" stop-color="#06090b"/>
    </radialGradient>
    <filter id="og-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="og-net">
      <g stroke="url(#og-edge)" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.92">
        <line x1="52" y1="60" x2="64" y2="24"/><line x1="52" y1="60" x2="97" y2="46"/><line x1="52" y1="60" x2="91" y2="85"/>
        <line x1="52" y1="60" x2="55" y2="101"/><line x1="52" y1="60" x2="20" y2="41"/>
        <line x1="64" y1="24" x2="97" y2="46" stroke-width="2" opacity="0.7"/>
        <line x1="91" y1="85" x2="55" y2="101" stroke-width="2" opacity="0.7"/>
        <line x1="20" y1="41" x2="64" y2="24" stroke-width="2" opacity="0.7"/>
      </g>
      <g stroke="#5ef2b3" stroke-width="1.4">
        <circle cx="64" cy="24" r="7.6" fill="url(#og-node)"/><circle cx="97" cy="46" r="7" fill="url(#og-node)"/>
        <circle cx="91" cy="85" r="6.6" fill="url(#og-node)"/><circle cx="55" cy="101" r="6.6" fill="url(#og-node)"/>
        <circle cx="20" cy="41" r="6.6" fill="url(#og-node)"/>
      </g>
      <circle cx="52" cy="60" r="12.4" fill="url(#og-anchor)" stroke="#fff0d6" stroke-width="1.6"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="#070b09"/>
  <ellipse cx="980" cy="300" rx="620" ry="520" fill="url(#og-aurora)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#19c37d" stroke-opacity="0.14" stroke-width="2"/>

  <text x="80" y="214" font-size="24" font-weight="700" letter-spacing="6" fill="#19c37d"
        font-family="'Geist',system-ui,sans-serif">CONTACT-OPS</text>
  <g font-family="'Bricolage Grotesque',system-ui,sans-serif" font-weight="700" letter-spacing="-2.2" fill="#eef5f1">
    <text x="76" y="312" font-size="78">Relationship</text>
    <text x="76" y="392" font-size="78">intelligence you</text>
    <text x="76" y="472" font-size="78">self-host<tspan fill="#19c37d">.</tspan></text>
  </g>
  <text x="80" y="542" font-size="22" font-weight="500" letter-spacing="0.3" fill="#8aa79b"
        font-family="'Geist',system-ui,sans-serif">Your contacts as a living graph you own, part of the Unicorn Commander suite.</text>

  <g transform="translate(836,163) scale(2.55)">
    <rect x="-6" y="-6" width="123" height="123" rx="26" fill="url(#og-tile)" stroke="#19c37d" stroke-opacity="0.18" stroke-width="1"/>
    <use href="#og-net" filter="url(#og-glow)" opacity="0.8"/>
    <use href="#og-net"/>
  </g>
</svg>
