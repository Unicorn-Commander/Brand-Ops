# Magic Unicorn. Canonical brand is magicunicorn.tech (magicunicorn.dev is legacy).
# Palette and tagline pulled from Magic-Unicorn-Marketing/magicunicorn.tech.

brand:
  slug: magic-unicorn
  display_name: Magic Unicorn
  tagline: Innovation That Doesn't Apologize
  parent: null
  description: |
    Magic Unicorn is a Charleston, SC technology company that builds AI
    platforms, automation systems, and production infrastructure, and co-builds
    companies alongside clients. It is the parent behind the Unicorn Commander
    suite, Center Deep, and the MAJIKS family (majiks.online music,
    majiks.studio creative apps). Its work ships to production rather than
    staying as demos, and the core of Unicorn Commander and Majik's Music Studio
    is open source.
  mark:
    asset_type: logo
    file: unicorn.svg
    kind: imported

visual:
  colors:
    primary: "#b66eff"               # unicorn purple
    accent: "#00d4ff"                # unicorn cyan
    background: "#0a0a0a"
    foreground: "#ffffff"
    muted: "#b3b3b3"
  typography:
    primary_font: Inter
    display_font: Inter
    mono_font: Monaco
  style_keywords:
    - dark UI
    - near-black background
    - purple-to-cyan gradient
    - neon glow
    - radial aurora accents
    - high contrast
    - glassy panels
    - playful-technical

voice:
  tone:
    - bold
    - confident
    - irreverent
    - direct
    - technical
    - unapologetic
  forbidden_phrases:
    - revolutionary
    - game-changer
    - synergize
    - unleash

prompts:
  logo:
    base: |
      Generate a logo for {brand_context}. Style: {style_keywords}. The logo
      should be {variant}. Output a clean square composition with a transparent
      background where possible. {ref_block}
    variants: [flat, monochrome, color, app-icon]
  app_icon:
    base: |
      Generate an app icon for {brand_context}. {style_keywords}. It must stay
      recognizable at small sizes like 32x32 and 64x64. Square composition,
      rounded corners, deep contrast. {ref_block}
    variants: [color, monochrome, dark, light]
  og_image:
    base: |
      Generate a 1200x630 share image for {brand_context}. Put the headline area
      on the left and the brand mark on the right. Topic: {topic}.
      {style_keywords}. {ref_block}
    variants: [default, dark, light]
  podcast_cover:
    base: |
      Generate a 3000x3000 square podcast cover for {brand_context}. Episode
      topic: {topic}. {style_keywords}. {ref_block}
    variants: [series, episode]
  social_card:
    base: |
      Generate a square social card for {brand_context}. Topic: {topic}.
      Platform: {platform}. {style_keywords}. {ref_block}
    variants: [instagram, twitter, linkedin]

reference_images:
  canonical: /Users/aaronstransky/Pictures/magic_unicorn_logo.png
  subdued: /Users/aaronstransky/Pictures/unicorn_subdued_black_logo.png
  vector: /Users/aaronstransky/AI-Software/MagiCode_sync/public/magic-unicorn-logo.svg
